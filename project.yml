name: CatDriveHUD
options:
  bundleIdPrefix: com.hohifamily
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  CatDriveHUD:
    type: application
    platform: iOS
    sources:
      - path: CatDriveHUD/AppDelegate.swift
      - path: CatDriveHUD/BLEManager.swift
      - path: CatDriveHUD/ContentView.swift
      - path: CatDriveHUD/DriveViewModel.swift
      - path: CatDriveHUD/MapViewRepresentable.swift
      - path: CatDriveHUD/NavigationManager.swift
      - path: CatDriveHUD/Design/HOHITheme.swift
      - path: CatDriveHUD/Views/HomeView.swift
      - path: CatDriveHUD/Views/MapScreen.swift
      - path: CatDriveHUD/Views/OrdersView.swift
      - path: CatDriveHUD/Views/ArrivalView.swift
      - path: CatDriveHUD/Views/Components/BottomBar.swift
      - path: CatDriveHUD/Views/Components/NavigationOverlay.swift
      - path: CatDriveHUD/Views/Components/RouteStopRow.swift
      - path: CatDriveHUD/Assets.xcassets
    info:
      path: CatDriveHUD/Info.plist
      properties:
        CFBundleDisplayName: Hohi Drive HUD
        CFBundleShortVersionString: "2.5"
        CFBundleVersion: "25"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Cần vị trí để dẫn đường và hiển thị tốc độ lên HUD"
        NSLocationAlwaysAndWhenInUseUsageDescription: "Cần vị trí chạy nền để tiếp tục dẫn đường khi để điện thoại xuống"
        NSBluetoothAlwaysUsageDescription: "Cần Bluetooth để kết nối với màn hình HUD ESP32"
        NSBluetoothPeripheralUsageDescription: "Cần Bluetooth để kết nối với màn hình HUD ESP32"
        UIBackgroundModes:
          - location
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hohifamily.hohidrivehud
        PRODUCT_NAME: CatDriveHUD
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SWIFT_VERSION: "5.0"
    dependencies:
      - sdk: MapKit.framework
